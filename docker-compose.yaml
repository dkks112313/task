version: "3.9"

services:
  app:
    build: .
    container_name: myapp
    ports:
      - "8080:8080"
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    depends_on:
      - app
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - app